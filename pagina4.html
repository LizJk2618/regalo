<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¿Estás lista? 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@300;400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; font-family:'DM Sans',sans-serif; }

body {
  min-height:100vh;
  background:linear-gradient(180deg,
    #1a6bcc 0%,#2196F3 30%,
    #29B6F6 30%,#4FC3F7 45%,
    #26C6DA 45%,#00BCD4 55%,
    #F5DEB3 55%,#F4C842 62%,
    #E8B830 66%,
    #C2956C 66%,#B8895A 80%,
    #A07040 100%
  );
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; position:relative; overflow:hidden;
}

/* ===== CIELO CON ATARDECER ===== */
.sky-glow {
  position:absolute; top:0; left:0; right:0; height:55%;
  background:radial-gradient(ellipse at 70% 40%,rgba(255,150,50,.3) 0%,transparent 60%);
  pointer-events:none;
}

/* SOL ATARDECER */
.sun-set {
  position:absolute; top:5%; right:16%;
  width:70px; height:70px;
  background:radial-gradient(circle,#FFE44D,#FF8C00);
  border-radius:50%;
  box-shadow:0 0 40px rgba(255,160,0,.7),0 0 80px rgba(255,100,0,.3);
  animation:sunSet 4s ease-in-out infinite;
}
@keyframes sunSet { 0%,100%{box-shadow:0 0 40px rgba(255,160,0,.7),0 0 80px rgba(255,100,0,.3)} 50%{box-shadow:0 0 70px rgba(255,160,0,.9),0 0 120px rgba(255,100,0,.5)} }

/* ===== NUBES ATARDECER ===== */
.cloud {
  position:absolute; background:rgba(255,180,100,.7); border-radius:50px;
  animation:cloudDrift var(--d,20s) var(--dl,0s) linear infinite;
}
.cloud::before,.cloud::after { content:''; position:absolute; background:inherit; border-radius:50%; }
.cloud::before { width:60%; height:130%; top:-50%; left:15%; }
.cloud::after  { width:45%; height:110%; top:-40%; right:10%; }
@keyframes cloudDrift { from{transform:translateX(-150px)} to{transform:translateX(calc(100vw + 150px))} }

/* PÁJAROS */
.bird {
  position:absolute; font-size:var(--fs,16px);
  animation:birdFly var(--d,8s) var(--dl,0s) linear infinite;
}
@keyframes birdFly { from{transform:translateX(-40px)} to{transform:translateX(calc(100vw + 40px))} }

/* ===== PALMERAS ===== */
.palm { position:absolute; bottom:0; pointer-events:none; z-index:1; }
.palm-trunk { width:22px; height:120px; background:linear-gradient(to right,#6B4423,#8B6914,#6B4423); border-radius:4px; margin:0 auto; transform:rotate(var(--rot,0deg)); transform-origin:bottom center; }
.palm-leaves { position:absolute; bottom:108px; left:50%; transform:translateX(-50%); }
.palm-leaf { position:absolute; width:80px; height:22px; background:linear-gradient(to right,#1a6b1a,#4CAF50,#66BB6A); border-radius:0 50% 50% 0; transform-origin:left center; transform:rotate(var(--lr,0deg)); }

/* ===== MAR ===== */
.sea-layer { position:absolute; bottom:34%; left:0; right:0; pointer-events:none; z-index:0; }
.wave-row { height:16px; }
.wave-anim {
  height:100%;
  background:linear-gradient(to bottom,rgba(255,255,255,.5),transparent);
  border-radius:50% 50% 0 0;
  animation:waveSlide var(--d,4s) var(--dl,0s) ease-in-out infinite alternate;
}
@keyframes waveSlide { from{transform:scaleX(1) translateX(0)} to{transform:scaleX(1.05) translateX(2%)} }

/* peces */
.fish { position:absolute; font-size:var(--fs,18px); bottom:var(--b,34%); animation:fishSwim var(--d,9s) var(--dl,0s) linear infinite; }
@keyframes fishSwim { from{transform:translateX(-50px) scaleX(1)} 49.9%{transform:translateX(calc(100vw + 50px)) scaleX(1)} 50%{transform:translateX(calc(100vw + 50px)) scaleX(-1)} to{transform:translateX(-50px) scaleX(-1)} }

/* ===== RECUADRO FIESTA ===== */
.party-box-wrap {
  position:relative; z-index:10;
  width:100%; max-width:320px;
  animation:partyPop .8s .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes partyPop { from{opacity:0;transform:scale(.5) rotate(-5deg)} to{opacity:1;transform:scale(1) rotate(0deg)} }

.party-box {
  background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  backdrop-filter:blur(10px);
  border-radius:24px;
  padding:30px 24px;
  border:2px solid rgba(255,255,255,.4);
  box-shadow:
    0 20px 60px rgba(0,0,0,.3),
    0 0 0 1px rgba(255,255,255,.1),
    inset 0 1px 0 rgba(255,255,255,.3);
  text-align:center; position:relative; overflow:hidden;
}

/* destellos en las esquinas del recuadro */
.party-box::before {
  content:'🎊'; position:absolute; top:12px; left:14px; font-size:22px;
  animation:cornerSpin 3s linear infinite;
}
.party-box::after {
  content:'🎊'; position:absolute; top:12px; right:14px; font-size:22px;
  animation:cornerSpin 3s linear infinite reverse;
}
@keyframes cornerSpin { 0%,100%{transform:rotate(0deg) scale(1)} 50%{transform:rotate(20deg) scale(1.2)} }

/* luz de fiesta detrás */
.disco-light {
  position:absolute; border-radius:50%; pointer-events:none;
  animation:discoMove var(--d,3s) var(--dl,0s) ease-in-out infinite alternate;
  opacity:.3;
}
@keyframes discoMove { from{transform:translate(0,0)} to{transform:translate(var(--tx,20px),var(--ty,10px))} }

.party-emojis { font-size:38px; margin-bottom:10px; animation:emojiBounce 1s ease-in-out infinite alternate; }
@keyframes emojiBounce { from{transform:scale(1)} to{transform:scale(1.1)} }

.party-title {
  font-family:'Pacifico',cursive;
  color:#fff; font-size:28px; line-height:1.2;
  text-shadow:2px 3px 0 rgba(0,0,0,.3),0 0 30px rgba(255,255,255,.5);
  margin-bottom:6px;
}
.party-subtitle {
  font-family:'Caveat',cursive; font-weight:600;
  color:rgba(255,255,255,.85); font-size:18px;
  margin-bottom:24px; letter-spacing:1px;
}

/* decoración de luces de fiesta */
.lights-row {
  display:flex; justify-content:center; gap:6px;
  margin-bottom:20px;
}
.light-bulb {
  width:14px; height:18px; border-radius:50% 50% 40% 40%;
  position:relative;
  animation:lightFlicker var(--d,1.5s) var(--dl,0s) ease-in-out infinite;
}
.light-bulb::after { content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); width:3px; height:6px; background:rgba(0,0,0,.3); }
@keyframes lightFlicker { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }

.party-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%;
  background:linear-gradient(135deg,#FF1744,#FF6B35,#FFD700);
  background-size:200% 200%;
  animation:btnGradient 2s ease infinite;
  color:#fff; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700;
  padding:16px 28px; border-radius:50px; border:none; cursor:pointer;
  box-shadow:0 6px 30px rgba(255,23,68,.5),0 0 0 3px rgba(255,255,255,.3);
  letter-spacing:1px;
  transition:transform .15s;
}
@keyframes btnGradient { 0%{background-position:0%} 50%{background-position:100%} 100%{background-position:0%} }
.party-btn:active { transform:scale(.97); }

/* confetti decorativo */
.conf {
  position:absolute; font-size:var(--fs,14px);
  animation:confDrift var(--d,4s) var(--dl,0s) ease-in-out infinite;
  pointer-events:none;
}
@keyframes confDrift { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-15px) rotate(20deg)} }
</style>
</head>
<body>

<div class="sky-glow"></div>
<div class="sun-set"></div>

<!-- NUBES -->
<div class="cloud" style="width:90px;height:32px;top:6%;left:-90px;--d:20s;--dl:0s"></div>
<div class="cloud" style="width:70px;height:26px;top:12%;left:-70px;--d:28s;--dl:8s"></div>

<!-- PÁJAROS -->
<div class="bird" style="--fs:14px;--d:10s;--dl:0s;top:8%">🦜</div>
<div class="bird" style="--fs:12px;--d:14s;--dl:4s;top:16%">🦜</div>
<div class="bird" style="--fs:10px;--d:9s;--dl:7s;top:5%">🦅</div>

<!-- PALMERAS -->
<div class="palm" style="left:-14px">
  <div class="palm-leaves">
    <div class="palm-leaf" style="--lr:-45deg;left:-35px"></div>
    <div class="palm-leaf" style="--lr:-20deg;left:-25px"></div>
    <div class="palm-leaf" style="--lr:5deg;left:-15px"></div>
    <div class="palm-leaf" style="--lr:30deg;left:-5px"></div>
    <div class="palm-leaf" style="--lr:55deg;left:5px"></div>
  </div>
  <div class="palm-trunk" style="--rot:-10deg"></div>
</div>
<div class="palm" style="right:-14px">
  <div class="palm-leaves">
    <div class="palm-leaf" style="--lr:-55deg;left:-75px"></div>
    <div class="palm-leaf" style="--lr:-30deg;left:-65px"></div>
    <div class="palm-leaf" style="--lr:-5deg;left:-55px"></div>
    <div class="palm-leaf" style="--lr:20deg;left:-45px"></div>
    <div class="palm-leaf" style="--lr:45deg;left:-35px"></div>
  </div>
  <div class="palm-trunk" style="--rot:10deg"></div>
</div>

<!-- MAR -->
<div class="sea-layer">
  <div class="wave-row"><div class="wave-anim" style="--d:3.5s;--dl:0s"></div></div>
  <div class="wave-row" style="margin-top:4px;opacity:.7"><div class="wave-anim" style="--d:4.5s;--dl:.8s"></div></div>
</div>

<!-- PECES -->
<div class="fish" style="--fs:16px;--d:10s;--dl:0s;--b:35%">🐠</div>
<div class="fish" style="--fs:12px;--d:13s;--dl:4s;--b:37%">🐡</div>

<!-- RECUADRO FIESTA -->
<div class="party-box-wrap">
  <div class="party-box">
    <!-- luces disco fondo -->
    <div class="disco-light" style="width:120px;height:120px;background:#FF1744;top:-40px;left:-40px;--d:2s;--dl:0s;--tx:20px;--ty:15px"></div>
    <div class="disco-light" style="width:100px;height:100px;background:#FFD700;bottom:-30px;right:-30px;--d:2.5s;--dl:.5s;--tx:-15px;--ty:-10px"></div>
    <div class="disco-light" style="width:80px;height:80px;background:#00BCD4;top:30%;left:60%;--d:3s;--dl:1s;--tx:10px;--ty:20px"></div>

    <!-- confetti decorativo -->
    <div class="conf" style="--fs:18px;--d:3s;--dl:0s;top:8px;left:30%">🎉</div>
    <div class="conf" style="--fs:14px;--d:3.5s;--dl:.5s;bottom:8px;right:30%">🎊</div>

    <!-- luces de fiesta -->
    <div class="lights-row">
      <div class="light-bulb" style="background:#FF1744;--d:1.2s;--dl:0s"></div>
      <div class="light-bulb" style="background:#FFD700;--d:1.4s;--dl:.2s"></div>
      <div class="light-bulb" style="background:#2196F3;--d:1.1s;--dl:.4s"></div>
      <div class="light-bulb" style="background:#4CAF50;--d:1.3s;--dl:.1s"></div>
      <div class="light-bulb" style="background:#FF6B35;--d:1.5s;--dl:.3s"></div>
      <div class="light-bulb" style="background:#9C27B0;--d:1.2s;--dl:.5s"></div>
      <div class="light-bulb" style="background:#FF1744;--d:1.4s;--dl:.2s"></div>
    </div>

    <div class="party-emojis">🎁🎊🎉</div>
    <div class="party-title">¿Estás listo para<br>tu regalo?</div>
    <div class="party-subtitle">🌴 Lo mejor está aquí 🌴</div>

    <button class="party-btn" onclick="goToBoleta()">
      🎟️ ¡Sí, estoy listo! 🔥
    </button>
  </div>
</div>

<script>
function goToBoleta() {
  // efecto de explosión antes de ir
  const btn = document.querySelector('.party-btn');
  btn.textContent = '🎊🎊🎊';
  btn.style.transform = 'scale(1.1)';

  // explotar emojis
  for(let i=0;i<20;i++){
    const e=document.createElement('div');
    e.style.cssText=`position:fixed;top:50%;left:50%;font-size:${16+Math.random()*20}px;z-index:999;pointer-events:none`;
    e.textContent=['🎉','🎊','⭐','🌟','💥','🔥','🎁'][Math.floor(Math.random()*7)];
    const angle=(i/20)*360;
    const dist=80+Math.random()*100;
    e.animate([
      {transform:'translate(-50%,-50%) scale(0)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(angle*Math.PI/180)*dist}px),calc(-50% + ${Math.sin(angle*Math.PI/180)*dist}px)) scale(1)`,opacity:0}
    ],{duration:700,easing:'ease-out',fill:'forwards'});
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),800);
  }

  setTimeout(()=>window.location.href='pagina5.html',600);
}
</script>
</body>
</html>

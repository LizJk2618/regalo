<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Con todo el amor para ti 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@300;400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; font-family:'DM Sans',sans-serif; }

body {
  min-height:100vh;
  background: linear-gradient(180deg,
    #87CEEB 0%,
    #87CEEB 35%,
    #40E0D0 35%,
    #20B2AA 55%,
    #F5DEB3 55%,
    #F4C842 65%,
    #E8B830 70%,
    #C2956C 70%,
    #B8895A 100%
  );
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; position:relative; overflow:hidden;
}

/* ===== CIELO Y NUBES ===== */
.cloud {
  position:absolute; background:#fff; border-radius:50px;
  opacity:.85; animation:cloudDrift var(--d,20s) var(--dl,0s) linear infinite;
}
.cloud::before,.cloud::after {
  content:''; position:absolute; background:#fff; border-radius:50%;
}
.cloud::before { width:60%; height:130%; top:-50%; left:15%; }
.cloud::after  { width:45%; height:110%; top:-40%; right:10%; }

@keyframes cloudDrift {
  from{transform:translateX(-200px)} to{transform:translateX(calc(100vw + 200px))}
}

/* ===== SOL ===== */
.sun {
  position:absolute; top:24px; right:24px;
  width:60px; height:60px;
  background:radial-gradient(circle,#FFE44D,#FFB800);
  border-radius:50%;
  box-shadow:0 0 30px rgba(255,215,0,.6);
  animation:sunPulse 3s ease-in-out infinite;
}
.sun::before {
  content:''; position:absolute; inset:-12px;
  border-radius:50%;
  background:repeating-conic-gradient(rgba(255,220,0,.3) 0deg 20deg, transparent 20deg 40deg);
  animation:sunRay 8s linear infinite;
}
@keyframes sunPulse { 0%,100%{box-shadow:0 0 30px rgba(255,215,0,.6)} 50%{box-shadow:0 0 60px rgba(255,215,0,.9)} }
@keyframes sunRay { from{transform:rotate(0)} to{transform:rotate(360deg)} }

/* ===== PALMERAS ===== */
.palm { position:absolute; bottom:0; pointer-events:none; }
.palm-trunk {
  width:18px; height:100px;
  background:linear-gradient(to right,#8B6914,#A0783C,#8B6914);
  border-radius:4px; margin:0 auto;
  transform:rotate(var(--rot,0deg)); transform-origin:bottom center;
}
.palm-leaves { position:absolute; bottom:90px; left:50%; transform:translateX(-50%); }
.palm-leaf {
  position:absolute; width:70px; height:20px;
  background:linear-gradient(to right,#2d8a2d,#4CAF50);
  border-radius:0 50% 50% 0;
  transform-origin:left center;
  transform:rotate(var(--lr,0deg));
}

/* ===== OLAS ===== */
.waves {
  position:absolute; bottom:28%; left:0; right:0; height:40px;
  overflow:hidden; pointer-events:none;
}
.wave {
  position:absolute; top:0; left:-50%; width:200%;
  height:40px;
  background:rgba(255,255,255,.4);
  border-radius:50% 50% 0 0;
  animation:waveMove var(--d,4s) var(--dl,0s) ease-in-out infinite alternate;
}
@keyframes waveMove { from{transform:translateX(0)} to{transform:translateX(8%)} }

/* ===== PECES ===== */
.fish {
  position:absolute; font-size:var(--fs,20px);
  animation:fishSwim var(--d,8s) var(--dl,0s) linear infinite;
  bottom:var(--b,32%);
}
@keyframes fishSwim {
  from{transform:translateX(-60px) scaleX(1)} 
  49%{transform:translateX(calc(100vw + 60px)) scaleX(1)}
  50%{transform:translateX(calc(100vw + 60px)) scaleX(-1)}
  to{transform:translateX(-60px) scaleX(-1)}
}

/* ===== TARJETA PRINCIPAL ===== */
.card-wrap {
  position:relative; z-index:10;
  animation:cardPop .8s .3s cubic-bezier(.34,1.56,.64,1) both;
  cursor:pointer;
  width:100%; max-width:320px;
}
.card-wrap:active { transform:scale(.97); transition:.1s; }

@keyframes cardPop { from{opacity:0;transform:scale(.5) translateY(40px)} to{opacity:1;transform:scale(1) translateY(0)} }

.gift-card {
  background:linear-gradient(135deg,#006994 0%,#0099CC 40%,#00B4D8 60%,#48CAE4 100%);
  border-radius:24px;
  padding:28px 24px 24px;
  box-shadow:
    0 20px 60px rgba(0,80,120,.4),
    0 0 0 2px rgba(255,255,255,.3),
    inset 0 1px 0 rgba(255,255,255,.4);
  position:relative; overflow:hidden;
  min-height:220px;
}

/* decoraciones dentro de la tarjeta */
.card-deco-wave {
  position:absolute; bottom:0; left:0; right:0; height:80px;
  background:rgba(255,255,255,.08);
  border-radius:60% 60% 0 0;
}
.card-deco-wave2 {
  position:absolute; bottom:10px; left:-20px; right:-20px; height:60px;
  background:rgba(255,255,255,.05);
  border-radius:60% 60% 0 0;
}
.card-shine {
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 50%);
  pointer-events:none;
}

.card-top {
  display:flex; justify-content:space-between; align-items:flex-start;
  margin-bottom:16px; position:relative; z-index:1;
}
.card-para-ti {
  font-family:'Pacifico',cursive;
  color:#FFE44D; font-size:28px;
  text-shadow:2px 2px 0 rgba(0,0,0,.2),0 0 20px rgba(255,228,77,.5);
  line-height:1.1;
}
.card-year {
  font-family:'Caveat',cursive; font-weight:700;
  color:rgba(255,255,255,.9); font-size:14px; letter-spacing:2px;
  background:rgba(255,255,255,.15); padding:4px 10px; border-radius:20px;
  backdrop-filter:blur(4px);
}

.card-emoji-row {
  display:flex; gap:8px; font-size:22px;
  margin-bottom:14px; position:relative; z-index:1;
}

.card-feliz {
  font-family:'Pacifico',cursive;
  color:#fff; font-size:22px;
  text-shadow:0 2px 10px rgba(0,0,0,.3);
  position:relative; z-index:1;
  margin-bottom:4px;
}
.card-anio {
  font-family:'Caveat',cursive; font-weight:700;
  color:#FFE44D; font-size:32px;
  text-shadow:2px 2px 0 rgba(0,0,0,.2);
  position:relative; z-index:1;
}

/* CAJA DE REGALO encima de la tarjeta */
.gift-box-container {
  position:absolute; top:-55px; right:20px; z-index:20;
  animation:giftFloat 3s ease-in-out infinite;
  cursor:pointer;
}
@keyframes giftFloat { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-10px) rotate(3deg)} }

.gbox { width:80px; height:70px; position:relative; }
.g-body {
  position:absolute; bottom:0; left:0; right:0; height:46px;
  background:linear-gradient(135deg,#FF6B35,#FF3D00);
  border-radius:2px 2px 4px 4px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 15px rgba(0,0,0,.3);
}
.g-body::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:10px; height:100%; background:rgba(255,255,255,.2);
}
.g-lid {
  position:absolute; top:14px; left:-4px; right:-4px; height:16px;
  background:linear-gradient(135deg,#FF8C42,#FF5722);
  border-radius:2px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.g-lid::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:10px; height:100%; background:rgba(255,255,255,.2);
}
.g-bow { position:absolute; top:0; left:50%; transform:translateX(-50%); width:36px; height:22px; z-index:3; }
.bl,.br {
  position:absolute; bottom:6px; width:16px; height:12px;
  background:linear-gradient(135deg,#FFE44D,#FFB800);
  border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.bl { left:0; transform:rotate(-30deg); transform-origin:bottom right; border-radius:50% 0 50% 50%; }
.br { right:0; transform:rotate(30deg); transform-origin:bottom left; }
.bc {
  position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  width:8px; height:8px; background:#FFD700; border-radius:50%; z-index:4;
}

.tap-hint {
  text-align:center; margin-top:24px;
  font-family:'Caveat',cursive; font-weight:700;
  color:rgba(255,255,255,.9); font-size:18px;
  text-shadow:0 2px 10px rgba(0,0,0,.3);
  animation:tapPulse 2s ease-in-out infinite;
  background:rgba(0,0,0,.15); padding:8px 20px; border-radius:20px;
  backdrop-filter:blur(4px);
}
@keyframes tapPulse { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.03)} }

/* ===== ESTRELLITAS ===== */
.sparkle {
  position:absolute; pointer-events:none;
  animation:sparklePop var(--d,2s) var(--dl,0s) ease-in-out infinite;
  font-size:var(--fs,16px);
}
@keyframes sparklePop { 0%,100%{opacity:0;transform:scale(.5)} 50%{opacity:1;transform:scale(1)} }
</style>
</head>
<body>

<!-- SOL -->
<div class="sun"></div>

<!-- NUBES -->
<div class="cloud" style="width:100px;height:35px;top:8%;left:-100px;--d:18s;--dl:0s"></div>
<div class="cloud" style="width:80px;height:28px;top:14%;left:-80px;--d:25s;--dl:6s"></div>
<div class="cloud" style="width:120px;height:40px;top:5%;left:-120px;--d:22s;--dl:11s"></div>

<!-- PALMERAS -->
<div class="palm" style="left:-10px">
  <div class="palm-leaves">
    <div class="palm-leaf" style="--lr:-40deg;left:-30px"></div>
    <div class="palm-leaf" style="--lr:-15deg;left:-20px"></div>
    <div class="palm-leaf" style="--lr:10deg;left:-10px"></div>
    <div class="palm-leaf" style="--lr:35deg;left:-5px"></div>
    <div class="palm-leaf" style="--lr:60deg;left:0px"></div>
  </div>
  <div class="palm-trunk" style="--rot:-8deg"></div>
</div>
<div class="palm" style="right:-10px">
  <div class="palm-leaves">
    <div class="palm-leaf" style="--lr:-60deg;left:-65px"></div>
    <div class="palm-leaf" style="--lr:-35deg;left:-55px"></div>
    <div class="palm-leaf" style="--lr:-10deg;left:-45px"></div>
    <div class="palm-leaf" style="--lr:15deg;left:-35px"></div>
    <div class="palm-leaf" style="--lr:40deg;left:-25px"></div>
  </div>
  <div class="palm-trunk" style="--rot:8deg"></div>
</div>

<!-- OLAS -->
<div class="waves">
  <div class="wave" style="--d:4s;--dl:0s"></div>
  <div class="wave" style="--d:5s;--dl:1s;opacity:.6;top:10px"></div>
</div>

<!-- PECES -->
<div class="fish" style="--fs:18px;--d:9s;--dl:0s;--b:33%">🐠</div>
<div class="fish" style="--fs:14px;--d:12s;--dl:3s;--b:36%">🐡</div>
<div class="fish" style="--fs:20px;--d:7s;--dl:6s;--b:31%">🐟</div>

<!-- ESTRELLAS DECORATIVAS -->
<div class="sparkle" style="--fs:16px;--d:2.5s;--dl:0s;top:25%;left:8%">⭐</div>
<div class="sparkle" style="--fs:12px;--d:3s;--dl:.7s;top:18%;right:15%">✨</div>
<div class="sparkle" style="--fs:14px;--d:2s;--dl:1.2s;top:30%;left:80%">🌟</div>

<!-- TARJETA PRINCIPAL -->
<div class="card-wrap" onclick="window.location.href='pagina2.html'">
  <!-- Caja de regalo flotando -->
  <div class="gift-box-container">
    <div class="gbox">
      <div class="g-bow"><div class="bl"></div><div class="br"></div><div class="bc"></div></div>
      <div class="g-lid"></div>
      <div class="g-body"></div>
    </div>
  </div>

  <!-- Tarjeta -->
  <div class="gift-card">
    <div class="card-shine"></div>
    <div class="card-deco-wave"></div>
    <div class="card-deco-wave2"></div>

    <div class="card-top">
      <div>
        <div class="card-para-ti">Para el hombrecito de mi vida</div>
      </div>
      <div class="card-year">🎊 2026</div>
    </div>

    <div class="card-anio">🌴 Todo comenzo hace casi 1 año </div>

    <div class="card-feliz">¡por eso esto es para ti!</div>
    <div class="card-anio">¡Feliz año mi amor bello!❤️</div>
  </div>

  <div class="tap-hint">🎁 Aqui comienza tu sorpresa 🎁</div>
</div>

</body>
</html>
